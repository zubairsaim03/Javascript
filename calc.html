<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">
    <button onclick="add()">Add</button>
    <button onclick="sub()">Subtract</button>
    <button onclick="multiply()">Multiply</button>
    <button onclick="divide()">Divide</button>  
    

    result: <span id="result"></span>
    <script>
        let num1 = document.getElementById("num1");
        let num2 = document.getElementById("num2");
        let result = document.getElementById("result");

        function add(){
            let sum = parseInt(num1.value) + parseInt(num2.value);
            result.innerHTML = sum;
        }
        function sub(){
            let difference = parseInt(num1.value) - parseInt(num2.value);
            result.innerHTML = difference;
        }
        function multiply(){
            let product = parseInt(num1.value) * parseInt(num2.value);
            result.innerHTML = product;
        }
        function divide(){
            let quotient = parseInt(num1.value) / parseInt(num2.value);
            result.innerHTML = quotient;
        }
    </script>
</body>
</html>
