<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #aaa;
            width: 300px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 18px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>Calculator</h1>

        <input type="number" id="num1" placeholder="Enter first number">

        <input type="number" id="num2" placeholder="Enter second number">

        <br>

        <button onclick="add()">+</button>
        <button onclick="subtract()">−</button>
        <button onclick="multiply()">×</button>
        <button onclick="divide()">÷</button>

        <div id="result">
            Result: 0
        </div>

    </div>


    <script>

        // Addition
        function add() {

            let number1 = Number(document.getElementById("num1").value);
            let number2 = Number(document.getElementById("num2").value);

            let answer = number1 + number2;

            document.getElementById("result").innerHTML =
                "Result: " + answer;
        }


        // Subtraction
        function subtract() {

            let number1 = Number(document.getElementById("num1").value);
            let number2 = Number(document.getElementById("num2").value);

            let answer = number1 - number2;

            document.getElementById("result").innerHTML =
                "Result: " + answer;
        }


        // Multiplication
        function multiply() {

            let number1 = Number(document.getElementById("num1").value);
            let number2 = Number(document.getElementById("num2").value);

            let answer = number1 * number2;

            document.getElementById("result").innerHTML =
                "Result: " + answer;
        }


        // Division
        function divide() {

            let number1 = Number(document.getElementById("num1").value);
            let number2 = Number(document.getElementById("num2").value);

            if (number2 === 0) {
                document.getElementById("result").innerHTML =
                    "Cannot divide by zero";
                return;
            }

            let answer = number1 / number2;

            document.getElementById("result").innerHTML =
                "Result: " + answer;
        }

    </script>

</body>
</html>
